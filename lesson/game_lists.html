#box input{width:100%;margin-top:12px;padding:10px;background:#05070e;color:#fff;border:2px solid #0ff;font-family:ui-monospace,monospace;font-size:14px;box-sizing:border-box}

<script>
const T=32, VW=800, VH=480;
const cv=document.getElementById('c'), g=cv.getContext('2d');
const $=id=>document.getElementById(id);

// mode: 'print' — вводим вывод print(), mode: 'cmd' — вводим команду Python
const TASKS=[
  // Уровень 1: Индексы, длина и операторы +, *, in

  {mode:'print', t:'Срез с шагом от 1',     c:'nums = [10, 20, 30, 40, 50]\nprint(nums[1::2])',                a:'[20, 40]'},
  {mode:'print', t:'Замена среза',          c:'a = [1, 2, 3, 4]\na[1:3] = [9]\nprint(len(a))',                a:'3'},
  {mode:'print', t:'Звёздочная распаковка', c:'a, *b, c = [10, 20, 30, 40, 50]\nprint(sum(b))',                a:'90'},

  {mode:'cmd',   t:'Добавление в конец',    c:'items = [1, 2, 3]\n# Добавь число 4 в конец списка items:',     a:'items.append(4)'},
  {mode:'cmd',   t:'Удаление последнего',   c:'stack = ["a", "b", "c"]\n# Удали последний элемент из stack:',   a:'stack.pop()'},

  {mode:'cmd',   t:'Разворот списка',       c:'logs = [1, 2, 3]\n# Разверни список logs на месте методом:',  a:'logs.reverse()'}

const WORLDS=[

    ],

    pads:[[6,13],[29,12],[47,12],[74,12]],

    coins:[

  {

    bg:'#12071d', sky2:'#220c36', roof:'#1d142e', neon:'#ff6b00', platCol:'#2e1e47', platNeon:'#00f5d4',

    ],
    mplat:[

      [44,8,3, 2,2,0.03],[56,8,3, 2,-2,0.032],[67,9,3, 2,2,0.03],

    ],

    coins:[
      [5,11],[15,4],[16,4],[27,7],[28,7],[39,4],[40,4],[51,6],[52,6],
      [63,5],[64,5],[74,7],[75,7],[85,9],[86,9],[95,5],[96,5]
    ],
    en:[[13,9,19],[24,12,32],[37,9,43],[48,11,55],[60,10,66],[71,12,79],[84,9,90]],
    sp:[[17,10],[29,13],[41,10],[64,11],[87,10]],
    tm:[[6,10,18],[16,3,19],[28,6,20],[40,3,21],[63,4,22],[85,8,23]]
  }
];

let wi=0, W, G, P, en, coins, sp, tms, pads, gates, mplats, portalPos, cam=0, lives=3, score=0;
let solved=Array(TASKS.length).fill(false), modal=false, activeTask=-1, near=null, state='play';
let trails=[], buildings=[], shake=0;
const keys={};
const KEY={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};

const solid=(tx,ty)=>tx<0||tx>=W.w||(ty>=0&&ty<15&&(G[ty][tx]==='#'||G[ty][tx]==='B'));

function hitWorld(x,y,w,h){
  for(let ty=Math.floor(y/T);ty<=Math.floor((y+h-1)/T);ty++)
    for(let tx=Math.floor(x/T);tx<=Math.floor((x+w-1)/T);tx++)
      if(solid(tx,ty)) return true;
  for(const gt of gates){
    if(solved[gt.t]) continue;
    if(x<gt.x+10 && x+w>gt.x+2 && y<gt.y+gt.h && y+h>gt.y) return true;
  }
  return false;
}

function hitMplat(x,y,w,h){
  for(const m of mplats){
    if(x<m.x+m.w && x+w>m.x && y<m.y+12 && y+h>m.y) return m;
  }
  return null;
}

function moveX(e,dx){
  e.x+=dx;
  if(!hitWorld(e.x,e.y,e.w,e.h)) return false;
  if(dx>0){
    let nx=Math.floor((e.x+e.w-1)/T)*T-e.w;
    for(const gt of gates){
      if(!solved[gt.t] && e.x+e.w>gt.x+2 && e.x<gt.x+10 && e.y<gt.y+gt.h && e.y+e.h>gt.y){
        nx=Math.min(nx,gt.x+2-e.w);
      }
    }
    e.x=nx;
  } else {
    let nx=(Math.floor(e.x/T)+1)*T;
    for(const gt of gates){
      if(!solved[gt.t] && e.x<gt.x+10 && e.x+e.w>gt.x+2 && e.y<gt.y+gt.h && e.y+e.h>gt.y){
        nx=Math.max(nx,gt.x+10);
      }
    }
    e.x=nx;
  }
  return true;
}

function moveY(e,dy){
  e.y+=dy;
  if(!hitWorld(e.x,e.y,e.w,e.h)){
    if(dy>0){
      const m=hitMplat(e.x,e.y,e.w,e.h);
      if(m && e.y+e.h-dy<=m.y+6){
        e.y=m.y-e.h;
        e.vy=0;
        e.onPlat=m;
      }
    }
    return;
  }
  if(dy>0) e.y=Math.floor((e.y+e.h-1)/T)*T-e.h;
  else e.y=(Math.floor(e.y/T)+1)*T;
  e.vy=0;
}

const over=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function genCity(w){
  const b=[];
  for(let x=0;x<w*T+500;x+=68){
    const bw=46+((x*17)%46);
    const bh=140+((x*31)%230);
    b.push({x,w:bw,h:bh,lit:(x%136===0)});
  }
  return b;
}

function loadWorld(i){
  wi=i; W=WORLDS[i];
  buildings=genCity(W.w);
  G=[]; for(let y=0;y<15;y++) G.push(Array(W.w).fill('.'));
  for(const [bx,by,bw,bh] of W.blocks){
    for(let y=by;y<by+bh && y<15;y++)
      for(let x=bx;x<bx+bw && x<W.w;x++)
        G[y][x]=(bh>1?'#':'B');
  }
  mplats=W.mplat.map(([x,y,w,dx,dy,spd],idx)=>({
    bx:x*T, by:y*T, x:x*T, y:y*T, w:w*T, dx:dx*T, dy:dy*T, spd, t:idx*1.4, vx:0, vy:0
  }));
  pads=W.pads.map(([x,y])=>({x:x*T,y:y*T-8,anim:0}));
  gates=W.gates.map(([x,y,h,t])=>({x:x*T+10,y:y*T,h:h*T,t}));
  coins=W.coins.map(([x,y])=>({x:x*T+10,y:y*T+10,got:false}));
  sp=W.sp.map(([x,y])=>({x:x*T,y:y*T}));
  tms=W.tm.map(([x,y,t])=>({x:x*T,y:y*T,t}));
  portalPos={x:W.portal[0]*T,y:W.portal[1]*T};
  spawn();
}

function spawn(){
  P={
    x:W.start[0]*T, y:W.start[1]*T+2, w:22, h:30,
    vx:0, vy:0, ground:false, face:1, jumpBuf:0, coyote:0,
    jumpsLeft:2, dashTime:0, dashCd:0, onPlat:null
  };
  en=W.en.map(([x,y,maxX],idx)=>({
    x:x*T+2, y:y*T+4, minX:x*T, maxX:maxX*T, w:28, h:22,
    vx:(idx%2?-1.25:1.25), baseY:y*T+4, phase:idx, dead:0
  }));
  cam=0; near=null; trails=[]; state='play';
}

function kill(){
  if(state!=='play') return;
  state='dead'; lives--; shake=12;
  setTimeout(()=>{
    if(lives<=0){
      lives=3; score=0;
      W.tm.forEach(([,,t])=>solved[t]=false);
      loadWorld(wi);
    } else spawn();
  },800);
}

function triggerDash(){
  if(state!=='play'||modal||P.dashCd>0||P.dashTime>0) return;
  P.dashTime=9;
  P.dashCd=36;
  P.vy=0;
}

function update(){
  if(state!=='play'||modal) return;
  if(shake>0) shake--;

  for(const m of mplats){
    const prevX=m.x, prevY=m.y;
    m.t+=m.spd;
    const s=(Math.sin(m.t)+1)/2;
    m.x=m.bx+m.dx*s;
    m.y=m.by+m.dy*s;
    m.vx=m.x-prevX;
    m.vy=m.y-prevY;
  }

  if(P.onPlat){
    moveX(P,P.onPlat.vx);
    P.y+=P.onPlat.vy;
  }
  P.onPlat=null;

  const d=(keys.l?-1:0)+(keys.r?1:0);
  if(d && P.dashTime<=0) P.face=d;
  if(P.dashCd>0) P.dashCd--;

  if(P.dashTime>0){
    P.dashTime--;
    P.vx=P.face*9.2;
    P.vy=0;
    moveX(P,P.vx);
    trails.push({x:P.x+P.w/2,y:P.y+P.h/2,vx:0,vy:0,life:12,col:W.neon,big:true});
  } else {
    P.vx=d*4.2;
    P.vy=Math.min(P.vy+0.54,12);
    moveX(P,P.vx);
    moveY(P,P.vy);
  }

  const onSolid=hitWorld(P.x,P.y+1,P.w,P.h);
  const onMplat=hitMplat(P.x,P.y+2,P.w,P.h);
  if(onMplat && P.vy>=0 && P.y+P.h<=onMplat.y+8){
    P.y=onMplat.y-P.h;
    P.vy=0;
    P.onPlat=onMplat;
  }
  P.ground=onSolid || !!P.onPlat;

  if(P.ground){ P.coyote=6; P.jumpsLeft=2; }
  else P.coyote=Math.max(0,P.coyote-1);

  for(const pd of pads){
    if(pd.anim>0) pd.anim--;
    if(over(P,{x:pd.x+2,y:pd.y,w:T-4,h:10}) && P.vy>=0){
      P.vy=-16.5;
      P.ground=false;
      P.coyote=0;
      P.jumpsLeft=1;
      pd.anim=14;
      for(let k=0;k<10;k++) trails.push({x:pd.x+T/2,y:pd.y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,life:16,col:'#ffe600'});
    }
  }

  if(P.jumpBuf>0){
    if(P.ground||P.coyote>0){
      P.vy=-10.6; P.ground=false; P.onPlat=null; P.coyote=0; P.jumpsLeft=1; P.jumpBuf=0;
    } else if(P.jumpsLeft>0){
      P.vy=-9.8; P.jumpsLeft=0; P.jumpBuf=0;
      for(let k=0;k<7;k++) trails.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-0.5)*3,vy:Math.random()*2+1,life:14,col:W.neon});
    } else {
      P.jumpBuf--;
    }
  }

  if(Math.abs(P.vx)>0.5 && P.dashTime<=0 && Math.random()<0.45){
    trails.push({x:P.x+P.w/2,y:P.y+P.h-4,vx:0,vy:0,life:10,col:W.platNeon});
  }
  for(const tr of trails){ tr.x+=tr.vx; tr.y+=tr.vy; tr.life--; }
  trails=trails.filter(tr=>tr.life>0);

  if(P.y>VH+T){ kill(); return; }

  const now=Date.now()/240;
  for(const e of en){
    if(e.dead) continue;
    if(moveX(e,e.vx) || e.x<e.minX || e.x>e.maxX) e.vx=-e.vx;
    e.y=e.baseY+Math.sin(now+e.phase)*5;
  }
  for(const e of en){
    if(e.dead||!over(P,e)) continue;
    if((P.vy>0 && P.y+P.h-P.vy<=e.y+12) || P.dashTime>0){
      e.dead=1; P.vy=-8.5; P.jumpsLeft=1; score+=5; shake=5;
    } else { kill(); return; }
  }

  for(const c of coins) if(!c.got&&over(P,{x:c.x,y:c.y,w:12,h:12})){ c.got=true; score++; }
  for(const s of sp) if(over(P,{x:s.x+5,y:s.y-14,w:22,h:14})){ kill(); return; }

  near=tms.find(t=>!solved[t.t]&&over(P,{x:t.x-10,y:t.y,w:T+20,h:2*T}))||null;

  const cleared=W.tm.every(([,,t])=>solved[t]);
  if(cleared&&over(P,{x:portalPos.x,y:portalPos.y-T,w:T,h:3*T})){
    if(wi+1<WORLDS.length) loadWorld(wi+1);
    else state='win';
    return;
  }
  cam=Math.max(0,Math.min(P.x+P.w/2-VW/2,W.w*T-VW));
}

function draw(){
  g.save();
  if(shake>0) g.translate((Math.random()-0.5)*5,(Math.random()-0.5)*5);

  const grad=g.createLinearGradient(0,0,0,VH);
  grad.addColorStop(0,W.bg);
  grad.addColorStop(1,W.sky2);
  g.fillStyle=grad; g.fillRect(0,0,VW,VH);

  for(const b of buildings){
    const bx=b.x-cam*0.35;
    if(bx+b.w<0||bx>VW) continue;
    const by=VH-b.h;
    g.fillStyle='rgba(8,12,24,0.78)';
    g.fillRect(bx,by,b.w,b.h);
    g.fillStyle=b.lit?W.neon:W.platNeon;
    g.globalAlpha=0.22;
    for(let wy=by+14;wy<VH-30;wy+=18){
      for(let wx=bx+8;wx<bx+b.w-10;wx+=14){
        if(((wx+wy)%3)===0) g.fillRect(wx,wy,6,8);
      }
    }
    g.globalAlpha=1;
  }

  const x0=Math.max(0,Math.floor(cam/T)), x1=Math.min(W.w-1,x0+Math.ceil(VW/T)+1);
  for(let ty=0;ty<15;ty++) for(let tx=x0;tx<=x1;tx++){
    const c=G[ty][tx]; if(c==='.') continue;
    const X=tx*T-cam, Y=ty*T;
    g.fillStyle=c==='#'?W.roof:W.platCol;
    g.fillRect(X,Y,T,T);
    if(c==='#' && ty%2===1 && tx%2===0){
      g.fillStyle='rgba(255,255,255,0.07)';
      g.fillRect(X+6,Y+8,8,12); g.fillRect(X+18,Y+8,8,12);
    }
    if(!solid(tx,ty-1)){
      g.fillStyle=c==='#'?W.neon:W.platNeon;
      g.fillRect(X,Y,T,4);
    }
    g.fillStyle='rgba(0,0,0,.32)'; g.fillRect(X,Y+T-2,T,2);
  }

  for(const m of mplats){
    const X=m.x-cam, Y=m.y;
    g.fillStyle='#19243d'; g.fillRect(X,Y,m.w,12);
    g.fillStyle=W.neon; g.fillRect(X,Y,m.w,3);
    g.fillStyle=W.platNeon; g.fillRect(X+6,Y+9,m.w-12,3);
  }

  for(const pd of pads){
    const X=pd.x-cam, Y=pd.y-(pd.anim>0?4:0);
    g.fillStyle='#222'; g.fillRect(X+2,pd.y+4,T-4,4);
    g.fillStyle='#ffe600'; g.fillRect(X+4,Y,T-8,5);
  }

  for(const gt of gates){
    if(solved[gt.t]) continue;
    const X=gt.x-cam;
    g.fillStyle='rgba(255,42,85,0.32)';
    g.fillRect(X,gt.y,12,gt.h);
    g.fillStyle='#ff2a55';
    g.fillRect(X+4,gt.y,4,gt.h);
    g.fillStyle='#fff'; g.font='7px "Press Start 2P", monospace';
    g.fillText('#'+(gt.t+1),X-2,gt.y-5);
  }

  const cleared=W.tm.every(([,,t])=>solved[t]);
  const px=portalPos.x-cam, py=portalPos.y-T, pt=Date.now()/250;
  g.fillStyle=cleared?`hsl(${(pt*45)%360},90%,60%)`:'#333a52';
  g.fillRect(px+3,py,T-6,3*T);
  g.fillStyle='#05070e'; g.fillRect(px+9,py+6,T-18,3*T-6);
  g.fillStyle=cleared?'#fff':'#778'; g.font='8px "Press Start 2P", monospace';
  g.fillText(cleared?'EXIT':'LOCKED',px-12,py-8);

  for(const t of tms){
    const X=t.x-cam, Y=t.y;
    g.fillStyle='#161b2e'; g.fillRect(X+2,Y,T-4,2*T);
    g.strokeStyle=solved[t.t]?'#00ff87':W.neon; g.lineWidth=2;
    g.strokeRect(X+2,Y,T-4,2*T);
    g.fillStyle=solved[t.t]?'#00ff87':'#ffbe0b';
    g.fillRect(X+6,Y+8,T-12,T-14);
    g.fillStyle='#000'; g.font='8px monospace';
    g.fillText(solved[t.t]?'OK':'#'+(t.t+1),X+7,Y+T-1);
  }

  for(const s of sp){
    const X=s.x-cam, Y=s.y;
    g.fillStyle='#ff2a55';
    g.beginPath(); g.moveTo(X+2,Y); g.lineTo(X+T/2,Y-16); g.lineTo(X+T-2,Y); g.fill();
    g.fillStyle='#fff';
    g.fillRect(X+T/2-1,Y-12,2,8);
  }

  for(const c of coins) if(!c.got){
    const cy=c.y+Math.sin(Date.now()/180+c.x)*2;
    g.fillStyle=W.neon; g.fillRect(c.x+2-cam,cy+2,8,8);
    g.fillStyle='#fff'; g.fillRect(c.x+4-cam,cy+4,4,4);
  }

  for(const e of en) if(!e.dead){
    const X=e.x-cam, Y=e.y;
    g.fillStyle='#2b324b'; g.fillRect(X+2,Y+5,e.w-4,13);
    g.fillStyle='#ff2a55'; g.fillRect(X+6,Y+9,e.w-12,5);
    g.fillStyle='#9aa5ce'; g.fillRect(X,Y+1,e.w,3);
  }

  for(const tr of trails){
    g.fillStyle=tr.col;
    g.globalAlpha=tr.life/16;
    const sz=tr.big?10:4;
    g.fillRect(tr.x-cam-sz/2,tr.y-sz/2,sz,sz);
  }
  g.globalAlpha=1;

  const X=P.x-cam;
  g.fillStyle=P.dashTime>0?W.neon:'#1d243b'; g.fillRect(X+2,P.y+6,P.w-4,P.h-6);
  g.fillStyle=W.neon; g.fillRect(X+2,P.y+12,P.w-4,4);
  g.fillStyle='#f4c29f'; g.fillRect(X+4,P.y,P.w-8,9);
  g.fillStyle=W.platNeon; g.fillRect(X+(P.face>0?11:3),P.y+3,8,3);

  if(near){
    g.fillStyle='#0ff'; g.font='8px "Press Start 2P", monospace';
    g.fillText('ENTER',near.x-cam-8,near.y-8);
  }

  if(state==='win'){
    g.fillStyle='rgba(4,6,14,.82)'; g.fillRect(0,0,VW,VH);
    g.fillStyle='#0ff'; g.font='18px "Press Start 2P", monospace'; g.textAlign='center';
    g.fillText('СИСТЕМА ВЗЛОМАНА!',VW/2,VH/2-12);
    g.fillStyle='#fff'; g.font='10px "Press Start 2P", monospace';
    g.fillText('Задания: '+solved.filter(Boolean).length+'/'+TASKS.length+' · Очки: '+score,VW/2,VH/2+22);
    g.textAlign='left';
  }
  g.restore();
}

function hud(){
  $('hWorld').textContent=W.name;
  $('hCoins').textContent='ЧИПЫ '+score;
  $('hLives').textContent='ЖИЗНИ '+lives;
  $('hTasks').textContent='ВЗЛОМ '+solved.filter(Boolean).length+'/'+TASKS.length;
}
function loop(){ update(); draw(); hud(); requestAnimationFrame(loop); }

function openTask(i){
  modal=true; activeTask=i;
  const task=TASKS[i];
  $('tTitle').textContent='Терминал #'+(i+1)+': '+task.t;
  $('tCode').textContent=task.c;
  $('tPrompt').textContent=task.mode==='cmd'
    ? 'Введи команду Python (например: items.append(4)):'
    : 'Введи вывод print() (например: 4, chip, [20, 30]):';
  $('tAns').value=''; $('msg').textContent='';
  $('modal').classList.add('show'); $('tAns').focus();
}
function closeModal(){
  modal=false; $('modal').classList.remove('show');
  for(const k in keys) delete keys[k];
}
function submit(){
  const norm=s=>s.trim().toLowerCase().replace(/\s+/g,'').replace(/"/g,"'");
  if(norm($('tAns').value)===norm(TASKS[activeTask].a)){
    solved[activeTask]=true; score+=10;
    $('msg').textContent='✅ Взломано! Барьер отключён (+10 чипов)';
    setTimeout(closeModal,800);
  } else $('msg').textContent='❌ Ошибка доступа, проверь ввод';
}
$('tOk').onclick=submit;
$('tCancel').onclick=closeModal;
$('tAns').addEventListener('keydown',e=>{
  if(e.key==='Enter') submit();
  if(e.key==='Escape') closeModal();
});

addEventListener('keydown',e=>{
  if(modal){ if(e.key==='Escape') closeModal(); return; }
  if(KEY[e.code]) keys[KEY[e.code]]=1;
  if(['Space','ArrowUp','KeyW'].includes(e.code)){
    e.preventDefault();
    if(!e.repeat&&P) P.jumpBuf=12;
  }
  if(['ShiftLeft','ShiftRight','KeyX'].includes(e.code)){
    e.preventDefault();
    if(!e.repeat&&P) triggerDash();
  }
  if(e.key==='Enter'&&near&&state==='play') openTask(near.t);
});
addEventListener('keyup',e=>{ if(KEY[e.code]) delete keys[KEY[e.code]]; });

loadWorld(0);
loop();
</script>
